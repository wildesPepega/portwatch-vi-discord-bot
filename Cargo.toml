[package]
name = "portwatch-bot"
version = "0.1.0"
edition = "2024"
description = "Unofficial Discord bot with a live progress widget for PortWatch VI (portwatch-vi.xyz)"
license = "MIT"
repository = "https://github.com/wildesPepega/portwatch-vi-discord-bot"
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
poise = "0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
